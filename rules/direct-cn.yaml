  - "+.qpic.cn"
  - "+.qlogo.cn"
  - "+.gtimg.cn"
  - "+.weixin.com"
  - "+.wechat.com"
  - "+.wechatapp.com"
  - "+.weixinbridge.com"
  - "+.tencent.com"
  - "+.tencent-cloud.net"
  - "+.myqcloud.com"
  - "+.tenpay.com"
